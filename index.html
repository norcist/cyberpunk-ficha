<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha Cyberpunk RED</title>
<style>
:root{--bg:#f1eeea;--panel:#fff;--ink:#17171b;--mute:#6c6a72;--line:#d6d1ca;--acc:#8a3a2b;--acc2:#00707f;--warn:#a85f00;--hdr:#0d0d0d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0c11;--panel:#15151d;--ink:#ecebf3;--mute:#8e8da1;--line:#2c2c3b;--acc:#e0553b;--acc2:#19e3ff;--warn:#ffb020;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c0c11;--panel:#15151d;--ink:#ecebf3;--mute:#8e8da1;--line:#2c2c3b;--acc:#e0553b;--acc2:#19e3ff;--warn:#ffb020;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hdr);z-index:20}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--hdr);color:#fff}
h1{margin:0;font:800 20px/1 "Courier New",monospace;letter-spacing:2px;text-transform:uppercase}h1 b{color:#e0553b}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;gap:4px;overflow-x:auto;padding:6px 12px 0;background:var(--hdr);border-bottom:3px solid var(--acc)}
nav button{background:transparent;color:#bdbdc6;border-radius:6px 6px 0 0;padding:9px 16px;white-space:nowrap;border:0}
nav button.on{background:var(--acc);color:#fff}
main{max-width:1100px;margin:0 auto;padding:14px}
.tab{display:none;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.tab.on{display:grid}
section{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:6px;padding:14px;min-width:0}
.wide{grid-column:1/-1}
.hd{margin:-14px -14px 12px;padding:6px 12px;background:var(--hdr);color:#fff;display:flex;justify-content:space-between;align-items:center;min-height:36px}
h2{margin:0;font:700 13px "Courier New",monospace;letter-spacing:2px;text-transform:uppercase}
h3{margin:0 0 4px;font:700 12px "Courier New",monospace;color:var(--acc);text-transform:uppercase;letter-spacing:1px}
input,select,textarea{width:100%;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font:inherit;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc2)}
input[type=number]{text-align:center;padding:6px 2px}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
.g{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.lp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.stat{border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center}
.stat input{font:700 22px "Courier New",monospace;border:0;padding:2px}
.stat span{font-size:11px;color:var(--mute);display:block}
.stat b{font:700 12px "Courier New",monospace;color:var(--acc)}
.der{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:12px}
.box{border:1px dashed var(--line);border-radius:6px;padding:8px;text-align:center}
.box em{display:block;font:700 24px "Courier New",monospace;font-style:normal}
.box small{color:var(--mute);font-size:11px;display:block}
.box input{font:700 22px "Courier New",monospace;border:0;padding:2px}
.state{display:inline-block;padding:2px 8px;border-radius:99px;font:700 12px "Courier New",monospace;border:1px solid currentColor}
.ok{color:var(--acc2)}.hurt{color:var(--warn)}.dead{color:var(--acc)}
.skills{columns:300px;column-gap:20px}
.cat{break-inside:avoid;margin-bottom:14px}
.sk{display:grid;grid-template-columns:1fr 42px 42px 42px 38px;gap:4px;align-items:center;margin-bottom:3px}
.sk.sh{font-size:10px;color:var(--mute);text-align:center;font-style:normal}.sk.sh i{font-style:normal}
.nm{display:flex;gap:4px;align-items:center;font-size:13px;min-width:0}.nm input{padding:3px 6px}
.sk input,.sk select{padding:3px 0;font-size:13px}
.sk b{font:700 11px "Courier New",monospace;color:var(--mute);text-align:center}
.sk output{font:700 14px "Courier New",monospace;text-align:center;color:var(--acc2)}
.gh{font-weight:700;font-size:13px;margin:6px 0 2px}
table{width:100%;border-collapse:collapse}td{padding:2px}th{font-size:11px;color:var(--mute);text-align:left;font-weight:600;padding:2px}
td.q{width:1%}td.q input{width:62px}
.tw{overflow-x:auto}
button{background:var(--acc);color:#fff;border:0;border-radius:4px;padding:7px 12px;font:700 12px "Courier New",monospace;letter-spacing:1px;cursor:pointer}
button.alt{background:transparent;color:inherit;border:1px solid #55555f}
.bar,.pm{display:flex;gap:6px;flex-wrap:wrap}.pm button{width:34px;padding:4px 0;font-size:16px;line-height:1}
.note{font-size:12px;color:var(--mute);margin:6px 0}
#io{max-width:1100px;margin:14px auto 0;padding:0 14px}
@media (max-width:700px){.lp{grid-template-columns:1fr}.lp>*{grid-column:auto!important}}

/* ===== Ficha: ferimentos + armadura ===== */
.row2{grid-column:1/-1;display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,2fr);gap:14px;align-items:stretch}
.arm{min-width:460px;table-layout:fixed}
.arm th{padding:2px 4px 6px;font-size:11px;letter-spacing:.5px;text-transform:uppercase}
.arm td{padding:4px}
.arm td:first-child{width:84px;font-weight:700;font-size:14px}
.arm td.q{width:96px}.arm td.q input{width:100%;font:700 15px "Courier New",monospace}
.arm input{padding:9px 10px}
/* ===== Cyberware: corpo ===== */
.hbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:12px}
.hbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
#hState{margin:8px 0 0;font:700 12px "Courier New",monospace;letter-spacing:1px}
.stage{grid-column:1/-1;position:relative;display:grid;grid-template-columns:minmax(0,1fr) 400px minmax(0,1fr);gap:26px;align-items:stretch;padding:18px;border:1px solid #2c2c3b;border-left:3px solid #e0553b;border-radius:6px;background:radial-gradient(ellipse at 50% 38%,#24121a 0,#09090e 58%,#050507 100%);--panel:#12121a;--ink:#ecebf3;--mute:#8e8da1;--line:#2c2c3b;--acc:#e0553b;--acc2:#19e3ff;--warn:#ffb020;color:var(--ink);color-scheme:dark;overflow:hidden}
.stage::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(25,227,255,.035) 0 1px,transparent 1px 4px);pointer-events:none}
.stage .tag{position:absolute;left:14px;top:8px;font:700 10px "Courier New",monospace;letter-spacing:2px;color:#19e3ff;opacity:.6}
#cyLines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
#cyLines .ln{fill:none;stroke:#19e3ff;stroke-opacity:.28;stroke-width:1.2;stroke-dasharray:4 3}
#cyLines .ln.on{stroke-opacity:.95;stroke-dasharray:none}
#cyLines circle{fill:#19e3ff;fill-opacity:.35}#cyLines .on+circle{fill-opacity:1}
.cycol{display:flex;flex-direction:column;justify-content:space-between;gap:12px;position:relative;z-index:2}
.fig{position:relative;align-self:center;width:100%;aspect-ratio:462/720}
.fig img{width:100%;height:100%;display:block;mix-blend-mode:screen;user-select:none;-webkit-user-drag:none}
.dot{position:absolute;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;background:rgba(5,5,9,.75);border:1.5px solid #19e3ff;color:#19e3ff;font:700 11px "Courier New",monospace;font-style:normal;display:grid;place-items:center;z-index:3;opacity:.75}
.dot.on{background:#19e3ff;color:#000;opacity:1;box-shadow:0 0 12px #19e3ff;animation:pulse 2.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 3px #19e3ff}}
.cyc{padding:10px}.cyc .hd{margin:-10px -10px 8px}
.cyc.on{border-color:#19e3ff55}
.hr{display:flex;align-items:center;gap:8px;flex-shrink:0}
.cyc h2{letter-spacing:1px;white-space:nowrap}
.sub{font:700 12px "Courier New",monospace;color:var(--warn)}
h2 .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#19e3ff;color:#000;margin-right:8px;font-size:11px;letter-spacing:0}
.cyb{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.cyb section,.cyc{min-width:0}
/* ===== Dados ===== */
.res{display:flex;gap:20px;align-items:center;flex-wrap:wrap;min-height:110px}
.res .big{font:800 58px/1 "Courier New",monospace;color:var(--acc2);min-width:90px;text-align:center}
.res .big.bad{color:var(--acc)}.res .big.crit{color:var(--warn)}
.res .info{flex:1;min-width:220px}
.res .lbl{font:700 13px "Courier New",monospace;letter-spacing:1px;text-transform:uppercase;color:var(--mute)}
.res .ver{display:inline-block;margin:6px 0;padding:3px 10px;border-radius:99px;border:1px solid currentColor;font:700 12px "Courier New",monospace}
.res .ver.good{color:var(--acc2)}.res .ver.bad{color:var(--acc)}.res .ver.crit{color:var(--warn)}
.res .det{font-size:13px;color:var(--mute);margin-top:4px}
.res .anim{animation:flash .5s}
.die{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 4px;border:1.5px solid var(--acc2);border-radius:6px;font:700 16px "Courier New",monospace;margin:2px;animation:pop .35s both}
.die.six{border-color:var(--warn);color:var(--warn)}.die.neg{border-color:var(--acc);color:var(--acc)}
@keyframes pop{from{transform:scale(.3) rotate(-60deg);opacity:0}to{transform:none;opacity:1}}
@keyframes flash{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.die,.res .anim,.dot.on{animation:none}}
.g3{grid-template-columns:repeat(3,1fr)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.chips button{padding:4px 8px;font-size:11px}
.rbtn{width:100%;padding:11px;font-size:14px;margin-top:6px}
#dr_log{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto;font-size:13px}
#dr_log li{padding:5px 0;border-bottom:1px solid var(--line)}
#dr_log time{color:var(--mute);font:11px "Courier New",monospace;margin-right:8px}
#dr_log li.good b{color:var(--acc2)}#dr_log li.bad b{color:var(--acc)}#dr_log li.crit b{color:var(--warn)}
@media (max-width:1000px){
 .stage{grid-template-columns:1fr 1fr;gap:12px}
 .fig{order:-1;grid-column:1/-1;max-width:320px;margin:0 auto}
 #cyLines{display:none}
 .cycol{display:contents}
}
@media (max-width:800px){.row2{grid-template-columns:1fr}}
@media (max-width:560px){.stage{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr 1fr}}
@media print{#tab_dados{display:none!important}.stage{break-inside:avoid}header .bar,nav,#io,.pm{display:none}.tab{display:grid}body{background:#fff;color:#000}section{break-inside:avoid}}
</style>
</head>
<body>
<header><h1>Cyberpunk <b>RED</b> // Ficha</h1>
<div class="bar"><button class="alt" id="bTheme">TEMA</button><button class="alt" id="bIO">BACKUP</button><button class="alt" onclick="print()">IMPRIMIR</button><button id="bReset">LIMPAR</button></div></header>
<nav id="tabs"></nav>
<div id="io" hidden><section><div class="hd"><h2>Backup (JSON)</h2></div>
<textarea id="json" spellcheck="false" placeholder="Clique em Gerar e copie o texto para guardar, ou cole um backup aqui e clique em Importar."></textarea>
<div class="bar" style="margin-top:8px"><button id="bExp">GERAR</button><button id="bImp">IMPORTAR</button></div>
<p class="note">A ficha é salva sozinha neste navegador. Use o backup para levar a ficha a outro aparelho.</p></section></div>
<main id="main"></main>

<script>
const $=id=>document.getElementById(id);
const F=(id,l,t="")=>`<div><label for="${id}">${l}</label><input id="${id}" ${t}></div>`;
const T=(id,l,h=80,s=1)=>`<div style="grid-column:span ${s}"><label for="${id}">${l}</label><textarea id="${id}" style="min-height:${h}px"></textarea></div>`;
const PM=k=>`<div class="pm"><button class="alt" data-l="${k}" data-d="-1" title="Remover última linha">−</button><button data-l="${k}" data-d="1" title="Adicionar linha">+</button></div>`;
const SEC=(t,b,x="",c="")=>`<section class="${c}"><div class="hd"><h2>${t}</h2>${x}</div>${b}</section>`;
const lst=k=>`<div class="tw"><table id="${k}"></table></div>`;
const NUM='type="number"';

const ST=[["INT","Inteligência"],["REF","Reflexos"],["DEX","Destreza"],["TECH","Técnica"],["COOL","Frieza"],["WILL","Vontade"],["LUCK","Sorte"],["MOVE","Movimento"],["BODY","Corpo"],["EMP","Empatia"]];
const ROLES={"Rockerboy":"Impacto Carismático","Solo":"Consciência de Combate","Netrunner":"Interface","Tech":"Fabricante","Medtech":"Medicina","Media":"Credibilidade","Exec":"Trabalho em Equipe","Lawman":"Apoio","Fixer":"Operador","Nomad":"Moto"};
const LISTS={
 weap:[["n","Arma"],["d","Dano"],["m","Munição"],["r","CdT"],["o","Notas"]],
 inv:[["n","Item"],["q","Qtd",1],["o","Notas"]],
 deck:[["n","Programa / Hardware"],["a","ATK",1],["d","DEF",1],["r","REZ",1],["c","Classe"]],
 cy:[["n","Implante"],["h","Perda",1]]
};
const CG=["Cyberolho (D)","Cyberolho (E)","Neural Link","Suíte de Cyberáudio","Cyberbraço / mão (D)","Cyberbraço / mão (E)","Interno","Cyberperna / pé (D)","Cyberperna / pé (E)","Externo","Fashionware","Borgware"];
const CNT={weap:3,inv:6,deck:6};CG.forEach((_,i)=>CNT["cy"+i]=2);
const LK=k=>LISTS[k.startsWith("cy")?"cy":k];
// ★ = básica, + = custo x2, @ = título de grupo, ~ = linha com nome editável
const SK=[
["Percepção",["Concentração:WILL*","Ocultar/Revelar Objeto:INT","Leitura Labial:INT","Percepção:INT*","Rastreamento:INT"]],
["Corpo",["Atletismo:DEX*","Contorcionismo:DEX","Dança:DEX","Resistência:WILL","Resistir a Tortura/Drogas:WILL","Furtividade:DEX*"]],
["Controle",["Dirigir Veículo Terrestre:REF","Pilotar Veículo Aéreo:REF+","Pilotar Veículo Marítimo:REF","Montaria:REF"]],
["Educação",["Contabilidade:INT","Trato com Animais:INT","Burocracia:INT","Negócios:INT","Composição:INT","Criminologia:INT","Criptografia:INT","Dedução:INT","Educação:INT*","Jogatina:INT","Pesquisa em Biblioteca:INT","Tática:INT","Sobrevivência:INT","@Idioma","~Gíria de rua:INT*","~:INT","~:INT","@Especialista Local","~Sua região:INT*","~:INT","~:INT","@Ciência","~:INT","~:INT"]],
["Combate",["Briga:DEX*","Evasão:DEX*","Arma Branca:DEX","@Artes Marciais ×2","~:DEX","~:DEX"]],
["Atuação",["Atuação:COOL","@Tocar Instrumento","~:TECH","~:TECH"]],
["Armas à Distância",["Arquearia:REF","Fogo Automático:REF+","Pistola:REF","Armas Pesadas:REF+","Fuzil/Espingarda:REF"]],
["Social",["Suborno:COOL","Conversação:EMP*","Percepção Humana:EMP*","Interrogatório:COOL","Persuasão:COOL*","Aparência Pessoal:COOL","Vida Urbana:COOL","Comércio:COOL","Moda e Estilo:COOL"]],
["Técnica",["Tecnologia Aérea:TECH","Tecnologia Básica:TECH","Cibertecnologia:TECH","Demolições:TECH+","Eletrônica/Segurança:TECH+","Primeiros Socorros:TECH*","Falsificação:TECH","Tecnologia Terrestre:TECH","Pintura/Desenho/Escultura:TECH","Paramédico:TECH+","Fotografia/Filme:TECH","Arrombar Fechaduras:TECH","Furtar:TECH","Tecnologia Marítima:TECH","Tecnologia de Armas:TECH"]]
];
let n=0;
const lvmd=(i,v)=>`<input id="lv${i}" ${NUM} min="0" max="10" value="${v}"><input id="md${i}" ${NUM} value="0">`;
const row=s=>{
  if(s[0]==="@")return `<div class="gh">${s.slice(1)}</div>`;
  const ed=s[0]==="~";if(ed)s=s.slice(1);
  const [nm,r]=s.split(":"),a=r.replace(/[*+]/g,""),st=r.includes("*"),x2=r.includes("+"),i=n++;
  const name=ed?`<input id="nm${i}" value="${nm}" placeholder="nome…">`:`${nm}${x2?" <small>×2</small>":""}`;
  return `<div class="sk" data-a="${a}"><div class="nm">${st?"★ ":""}${name}</div>${lvmd(i,st?2:0)}<b>${a}</b><output>0</output></div>`;
};
const SEL="INT REF DEX TECH COOL WILL EMP BODY".split(" ");
const crow=()=>{const i=n++;return `<div class="sk" data-a=""><div class="nm"><input id="nm${i}" placeholder="Perícia personalizada"></div>${lvmd(i,0)}<select id="st${i}">${SEL.map(s=>`<option>${s}</option>`).join("")}</select><output>0</output></div>`};
const SH=`<div class="sk sh"><span></span><i>NÍV</i><i>MOD</i><i>ATR</i><i>BASE</i></div>`;

const LP=[["lp_origem","Origens Culturais"],["lp_pers","Personalidade",2],["lp_roupa","Roupas e Cabelo",2],["lp_valor","O que mais valoriza"],["lp_sent","Sentimentos sobre as Pessoas"],["lp_pessoa","Pessoa mais valorizada"],["lp_posse","Posse mais valorizada"],["lp_fam","Origem Familiar"],["lp_inf","Ambiente da Infância"],["lp_crise","Crise Familiar"],["lp_meta","Objetivos de Vida"],["lp_amor","Casos de Amor Trágicos",2]];
const KC=[["kc_amigos","Amigos"],["kc_inim","Inimigos"],["kc_porque","Por quê?"],["kc_role","Lifepath da Função",2],["kc_lancar","O que podem lançar contra você?"],["kc_rep","Reputação e Eventos"],["kc_imp","Aprimoramento"]];
const lpHtml=a=>`<div class="lp">${a.map(([id,l,s])=>T(id,l,70,s||1)).join("")}</div>`;
const box=(l,v)=>`<div class="box"><small>${l}</small>${v}</div>`;

const P={};
P.ficha=SEC("Identidade",`<div class="g g2">${F("nome","Handle")}${F("alias","Apelidos / Aliases")}<div><label for="role">Função (Role)</label><select id="role">${Object.keys(ROLES).map(r=>`<option>${r}</option>`).join("")}</select></div>${F("rank","Habilidade de função (#)",NUM+' min="1" max="10" value="4"')}</div><p class="note" id="roleAb"></p>`,"","wide")
+SEC("Atributos",`<div class="stats">${ST.map(([k,t])=>`<div class="stat"><b>${k}</b><input id="s_${k}" ${NUM} min="1" max="${k==="MOVE"?10:8}" value="5"><span>${t}</span></div>`).join("")}</div>
<div class="der">${box("PV MÁXIMOS",'<em id="hpMax">0</em>')}${box("PV ATUAIS",`<input id="hp" ${NUM} value="0">`)}${box("FERIDA GRAVE (abaixo de)",'<em id="hurt">0</em>')}${box("TESTE DE MORTE",'<em id="death">0</em>')}${box("HUMANIDADE (atual / máx)",'<em id="hum">0</em>')}${box("SORTE",`<input id="luck" ${NUM} value="0">`)}</div>
<p style="margin:10px 0 0">Estado: <span class="state ok" id="state">—</span></p>`,"","wide")
+`<div class="row2">`+SEC("Ferimentos e Vícios",`<div class="g">${T("crit","Ferimentos críticos",90)}${T("addic","Vícios",90)}</div>`)
+SEC("Armadura (PA)",`<div class="tw"><table class="arm"><tr><th></th><th>Nome / Tipo</th><th>PA</th><th>Máx</th><th>Penal.</th></tr>${[["ah","Cabeça"],["ab","Corpo"],["as","Escudo"]].map(([r,t])=>`<tr><td>${t}</td><td><input id="${r}_n" placeholder="ex.: Kevlar leve"></td>${["c","m","p"].map(c=>`<td class="q"><input id="${r}_${c}" ${NUM}></td>`).join("")}</tr>`).join("")}</table></div><p class="note">PA = pontos de armadura atuais · Máx = valor original · Penal. = redução em REF/DEX/MOVE. A armadura perde 1 de PA a cada ataque que a penetra.</p>`)+`</div>`
+SEC("Armas",lst("weap"),PM("weap"),"wide");

<p class="note">Teste de Morte: role 1d10 + penalidade; se for menor que seu CORPO, você sobrevive. A penalidade sobe +1 a cada teste até você ser estabilizado.</p>`)
+SEC("Dano",`<div class="g"><div><label for="dr_w">Arma da ficha (preenche o nº de d6)</label><select id="dr_w"></select></div>
<div class="g g3"><div><label for="dr_n">Qtd. de d6</label><input id="dr_n" ${NUM} min="1" max="20" value="2"></div><div><label for="dr_db">Bônus fixo</label><input id="dr_db" ${NUM} value="0"></div><div><label for="dr_sp">PA do alvo</label><input id="dr_sp" ${NUM} min="0" value="0"></div></div></div>
<div class="chips">${[1,2,3,4,5,6].map(n=>`<button class="alt" data-n="${n}">${n}d6</button>`).join("")}</div>
<button class="rbtn" data-roll="dmg">ROLAR DANO</button>
<p class="note">Dois ou mais 6 = Ferimento Crítico: +5 de dano direto aos PV (só se o dano ultrapassar a armadura). A armadura perde 1 PA quando é penetrada.</p>`)
+SEC("Dados Livres",`<label for="dr_expr">Expressão (ex.: 2d6+3, 1d10, 7d6−2)</label><input id="dr_expr" value="1d10" spellcheck="false">
<div class="chips">${["1d6","2d6","3d6","1d10","2d10","1d20","1d100"].map(x=>`<button class="alt" data-expr="${x}">${x}</button>`).join("")}</div>
<button class="rbtn" data-roll="free">ROLAR</button>
<p class="note">Útil para perda de Humanidade (ex.: 2d6, 7d6), cura, dano de queda, tabelas de lifepath e afins.</p>`)
+SEC("Histórico",`<ul id="dr_log"><li style="color:var(--mute)">Nenhuma rolagem ainda.</li></ul>`,`<button class="alt" id="dr_clr" style="padding:4px 10px">LIMPAR</button>`,"wide");

P.deck=SEC("Cyberdeck",`<div class="g g4">${F("dk_n","Modelo")}${F("dk_p","Slots de programa",NUM)}${F("dk_h","Slots de hardware",NUM)}${F("dk_u","Slots universais",NUM)}</div>`,"","wide")
+SEC("Programas / Hardware",lst("deck"),PM("deck"),"wide");
P.inv=SEC("Meus Pertences",`<div class="g g4">${F("casa","Moradia")}${F("aluguel","Aluguel")}${F("estilo","Estilo de vida")}${F("eb","Eurodólares (eb)",NUM)}${F("ip","Pontos de Aprimoramento (IP)",NUM)}${F("rep","Reputação",NUM)}</div><div style="margin-top:10px">${T("moda","Moda",60)}</div>`,"","wide")
+SEC("Inventário",lst("inv"),PM("inv"),"wide");

const TABS=[["ficha","Ficha"],["pericias","Perícias"],["lifepath","Lifepath"],["cyber","Cyberware"],["deck","Cyberdeck"],["inv","Inventário"],["dados","Dados"]];
$("tabs").innerHTML=TABS.map(([k,t])=>`<button data-t="${k}">${t}</button>`).join("");
$("main").innerHTML=TABS.map(([k])=>`<div class="tab" id="tab_${k}">${P[k]}</div>`).join("");
let TAB="ficha";
function show(t){TAB=t;if(t==="dados")refreshDice();TABS.forEach(([k])=>{$("tab_"+k).classList.toggle("on",k===t);document.querySelector(`[data-t="${k}"]`).classList.toggle("on",k===t)});if(t==="cyber")requestAnimationFrame(drawLines)}

function renderList(k){
  const L=LK(k),keep={};
  document.querySelectorAll("#"+k+" input").forEach(e=>keep[e.id]=e.value);
  let h="<tr>"+L.map(c=>`<th>${c[1]}</th>`).join("")+"</tr>";
  for(let i=0;i<CNT[k];i++)h+="<tr>"+L.map(c=>`<td${c[2]?' class="q"':""}><input id="${k}_${i}_${c[0]}"${c[2]?' type="number" min="0"':""}${c[0]==="h"?' class="hl"':""}></td>`).join("")+"</tr>";
  $(k).innerHTML=h;
  for(const id in keep){const e=$(id);if(e)e.value=keep[id]}
  requestAnimationFrame(drawLines);
}
Object.keys(CNT).forEach(renderList);

const val=id=>+$(id).value||0;
function calc(){
  const body=val("s_BODY"),will=val("s_WILL"),emp=val("s_EMP");
  const hp=10+5*Math.ceil((body+will)/2),hurt=Math.ceil(hp/2);
  let loss=0;document.querySelectorAll(".hl").forEach(e=>loss+=+e.value||0);
  const hmax=emp*10,hcur=Math.max(0,hmax-loss);
  $("hpMax").textContent=hp;$("hurt").textContent=hurt;$("death").textContent=body;
  $("hum").textContent=hcur+" / "+hmax;
  $("hmax").textContent=hmax;$("loss").textContent=loss;$("hcur").textContent=hcur;$("empEf").textContent=Math.floor(hcur/10);
  const cur=$("hp").value===""?hp:val("hp");let t="Saudável",c="ok";
  if(cur<=0){t="Mortalmente ferido (teste de morte)";c="dead"}
  else if(cur<hurt){t="Gravemente ferido (−2 em todas as ações)";c="hurt"}
  else if(cur<hp){t="Ferido"}
  $("state").textContent=t;$("state").className="state "+c;
  document.querySelectorAll(".sk:not(.sh)").forEach(r=>{
    const x=r.querySelectorAll("input[type=number]"),s=r.querySelector("select"),a=s?s.value:r.dataset.a;
    r.querySelector("output").textContent=val("s_"+a)+(+x[0].value||0)+(+x[1].value||0);
  });
  $("hbar").style.width=(hmax?hcur/hmax*100:0)+"%";
  const hs=$("hState");
  if(hcur<=0){hs.textContent="⚠ HUMANIDADE 0 — CIBERPSICOSE";hs.className="dead"}
  else if(Math.floor(hcur/10)<emp){hs.textContent="EMP reduzida em "+(emp-Math.floor(hcur/10))+" por perda de Humanidade";hs.className="hurt"}
  else{hs.textContent="Humanidade intacta";hs.className="ok"}
  CG.forEach((_,i)=>{const k="cy"+i;let s=0,used=false;document.querySelectorAll("#"+k+" input").forEach(e=>{if(e.value!=="")used=true;if(e.classList.contains("hl"))s+=+e.value||0});
    const sb=$("sub_"+k);if(sb)sb.textContent=s?"−"+s:"";
    document.querySelectorAll(`[data-k="${k}"]`).forEach(e=>e.classList.toggle("on",used))});
  drawLines();
  $("roleAb").textContent="Habilidade de função: "+ROLES[$("role").value]+" (rank "+val("rank")+")";
}

const KEY="cpr_ficha_v2";
const dump=()=>{const d={};document.querySelectorAll("input[id],select[id],textarea[id]").forEach(e=>{if(e.id!=="json"&&!e.id.startsWith("dr_"))d[e.id]=e.value});d.__n=CNT;d.__t=TAB;return d};
function save(){try{localStorage.setItem(KEY,JSON.stringify(dump()))}catch(e){}}
function load(d){
  if(d.__n){for(const k in CNT)if(Number.isInteger(d.__n[k]))CNT[k]=Math.max(0,Math.min(40,d.__n[k]));Object.keys(CNT).forEach(renderList)}
  for(const k in d){const e=$(k);if(e&&k!=="json"&&typeof d[k]==="string")e.value=d[k]}
  if(typeof d.__t==="string"&&$("tab_"+d.__t))show(d.__t);
}
show("ficha");
try{const raw=localStorage.getItem(KEY)||localStorage.getItem("cpr_ficha_v1");if(raw)load(JSON.parse(raw))}catch(e){}
if(!$("hp").value||$("hp").value==="0"){calc();$("hp").value=$("hpMax").textContent}
calc();

document.addEventListener("input",()=>{calc();save()});
document.addEventListener("click",ev=>{
  const t=ev.target.closest("button[data-t]");
  if(t){show(t.dataset.t);save();scrollTo(0,0);return}
  const b=ev.target.closest("button[data-l]");if(!b)return;
  const k=b.dataset.l,d=+b.dataset.d,L=LK(k);
  if(d<0&&CNT[k]>0){const last=CNT[k]-1;if(L.some(c=>$(`${k}_${last}_${c[0]}`).value!=="")&&!confirm("Remover a última linha? Os dados dela serão apagados."))return}
  CNT[k]=Math.max(0,Math.min(40,CNT[k]+d));renderList(k);calc();save();
});

// ===== Linhas do corpo =====
function drawLines(){
  const st=$("cyStage"),svg=$("cyLines");
  if(!st||!svg)return;
  if(!st.offsetParent||getComputedStyle(svg).display==="none"){svg.innerHTML="";return}
  const sr=st.getBoundingClientRect();
  svg.setAttribute("viewBox",`0 0 ${sr.width} ${sr.height}`);
  let h="";
  BP.forEach(([i,side])=>{
    const k="cy"+i,c=st.querySelector(`.cyc[data-k="${k}"]`),d=st.querySelector(`.dot[data-k="${k}"]`);
    if(!c||!d)return;
    const cr=c.getBoundingClientRect(),dr=d.getBoundingClientRect();
    const x1=(side==="L"?cr.right:cr.left)-sr.left,y1=cr.top+cr.height/2-sr.top;
    const xd=dr.left+dr.width/2-sr.left,yd=dr.top+dr.height/2-sr.top;
    const xm=x1+(side==="L"?16:-16);
    h+=`<polyline class="ln ${c.classList.contains("on")?"on":""}" points="${x1},${y1} ${xm},${y1} ${xd},${yd}"/><circle cx="${x1}" cy="${y1}" r="3"/>`;
  });
  svg.innerHTML=h;
}
if(window.ResizeObserver&&$("cyStage"))new ResizeObserver(drawLines).observe($("cyStage"));
addEventListener("resize",drawLines);

// ===== Dados =====
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return Math.floor(a[0]/4294967296*n)+1};
let SKL=[],LASTHP=0;const LOG=[];
function refreshDice(){
  const sel=$("dr_sk"),prev=sel.value&&SKL[+sel.value]?SKL[+sel.value].n:"";
  SKL=[];
  ST.forEach(([k,t])=>SKL.push({n:`${t} (${k})`,v:val("s_"+k),g:"Atributos"}));
  SKL.push({n:"Habilidade de função: "+ROLES[$("role").value],v:val("rank"),g:"Função"});
  const sk=[];
  document.querySelectorAll(".sk:not(.sh)").forEach(r=>{
    const ni=r.querySelector(".nm input"),s=r.querySelector("select");
    const name=(ni?ni.value:r.querySelector(".nm").textContent.replace("★","").replace("×2","")).trim();
    if(!name)return;
    const a=s?s.value:r.dataset.a;
    sk.push({n:`${name} (${a})`,v:+r.querySelector("output").textContent||0,g:"Perícias"});
  });
  sk.sort((x,y)=>x.n.localeCompare(y.n,"pt-BR"));
  SKL=SKL.concat(sk);
  let h="",g="";
  SKL.forEach((s,i)=>{if(s.g!==g){if(g)h+="</optgroup>";h+=`<optgroup label="${s.g}">`;g=s.g}
    h+=`<option value="${i}">${esc(s.n)}  ${s.v>=0?"+":""}${s.v}</option>`});
  sel.innerHTML=h+"</optgroup>";
  const keep=SKL.findIndex(s=>s.n===prev);
  sel.value=keep>=0?keep:SKL.findIndex(s=>s.n.startsWith("Percepção ("));
  const w=$("dr_w"),wp=w.value;let wh='<option value="">— manual —</option>';
  for(let i=0;i<CNT.weap;i++){const n=$(`weap_${i}_n`).value.trim(),d=$(`weap_${i}_d`).value.trim();if(n||d)wh+=`<option value="${esc(d)}">${esc(n||"Arma "+(i+1))}${d?" — "+esc(d):""}</option>`}
  w.innerHTML=wh;w.value=wp;if(w.value!==wp)w.value="";
}
function pushLog(label,txt,cls){
  LOG.unshift({t:new Date().toLocaleTimeString("pt-BR"),label,txt,cls:cls||""});LOG.length=Math.min(LOG.length,40);
  $("dr_log").innerHTML=LOG.map(l=>`<li class="${l.cls}"><time>${l.t}</time><b>${esc(l.label)}</b> ${esc(l.txt)}</li>`).join("");
}
function showRes(o){
  $("dr_big").textContent=o.total;$("dr_big").className="big "+(o.cls||"");
  $("dr_lbl").textContent=o.label;
  $("dr_ver").innerHTML=o.ver?`<span class="ver ${o.cls||""}">${o.ver}</span>`:"";
  $("dr_dice").innerHTML=(o.dice||[]).map((d,i)=>`<span class="die ${d.c||""}" style="animation-delay:${i*45}ms">${d.t}</span>`).join("");
  $("dr_det").textContent=o.det||"";
  $("dr_act").innerHTML=o.act||"";
  const r=$("dr_res");r.classList.remove("anim");void r.offsetWidth;r.classList.add("anim");
  pushLog(o.label,`${o.total}${o.ver?" · "+o.ver.replace(/<[^>]+>/g,""):""}`,o.cls);
}
function rollSkill(){
  const s=SKL[+$("dr_sk").value];if(!s)return;
  const mod=val("dr_mod"),have=val("luck");let lk=Math.max(0,val("dr_luck"));lk=Math.min(lk,have);
  const d=rnd(10);let ex=0,exd=null,tag="";
  if(d===10){exd=rnd(10);ex=exd;tag="crit"}else if(d===1){exd=rnd(10);ex=-exd;tag="bad"}
  const total=s.v+mod+lk+d+ex,dvS=$("dr_dv").value,dv=dvS===""?null:+dvS;
  let ver="",cls="";
  if(dv!==null){const ok=total>=dv;ver=ok?"SUCESSO":"FALHA";cls=ok?"good":"bad"}
  if(d===10){ver=(ver?ver+" · ":"")+"CRÍTICO";cls="crit"}
  if(d===1){ver=(ver?ver+" · ":"")+"FALHA CRÍTICA";cls="bad"}
  const parts=[`base ${s.v}`];if(mod)parts.push((mod>0?"mod +":"mod ")+mod);if(lk)parts.push("sorte +"+lk);
  if(lk){$("luck").value=have-lk;$("dr_luck").value=0;calc();save()}
  showRes({label:s.n,total,cls,ver:dv!==null?ver+" (DV "+dv+")":ver,
    dice:[{t:d,c:d===10?"six":d===1?"neg":""}].concat(exd!==null?[{t:(ex<0?"−":"+")+exd,c:ex<0?"neg":"six"}]:[]),
    det:`d10 ${d}${exd!==null?(ex<0?" − ":" + ")+exd:""} + ${parts.join(" + ")} = ${total}`});
}
function rollInit(){
  const ref=val("s_REF"),mod=val("dr_mod"),d=rnd(10);
  showRes({label:"Iniciativa",total:ref+mod+d,dice:[{t:d}],det:`d10 ${d} + REF ${ref}${mod?" + mod "+mod:""} = ${ref+mod+d}`});
}
function rollDeath(){
  const body=val("s_BODY"),pen=val("dr_pen"),d=rnd(10),eff=d+pen,ok=eff<body;
  $("dr_pen").value=pen+1;
  showRes({label:"Teste de Morte",total:eff,cls:ok?"good":"bad",ver:ok?"SOBREVIVE":"MORTE",dice:[{t:d,c:ok?"":"neg"}],
    det:`d10 ${d}${pen?" + penalidade "+pen:""} = ${eff} contra CORPO ${body} (precisa ser menor). Próxima penalidade: ${pen+1}.`});
}
function rollDmg(){
  const n=Math.max(1,Math.min(20,val("dr_n")||1)),b=val("dr_db"),sp=val("dr_sp");
  const ds=Array.from({length:n},()=>rnd(6)),six=ds.filter(x=>x===6).length,crit=six>=2;
  const tot=ds.reduce((a,x)=>a+x,0)+b,thru=Math.max(0,tot-sp),hp=thru>0?thru+(crit?5:0):0;
  LASTHP=hp;
  let ver=hp>0?`${hp} PV de dano`:"ARMADURA ABSORVEU",cls=hp>0?"bad":"good";
  if(crit){ver=(hp>0?ver+" · ":"")+"FERIMENTO CRÍTICO"+(hp>0?" (+5)":" (sem bônus: não penetrou)");cls="crit"}
  showRes({label:`Dano ${n}d6${b?(b>0?"+":"")+b:""}`,total:tot,cls,ver,dice:ds.map(x=>({t:x,c:x===6?"six":""})),
    det:`Soma ${tot} − PA ${sp} = ${thru} que passa${crit&&hp>0?" + 5 de bônus crítico":""}.${hp>0&&sp>0?" A armadura perde 1 PA.":""}`,
    act:hp>0?`<button data-apply="1" style="margin-top:8px">APLICAR −${hp} PV NA FICHA</button>`:""});
}
function parseExpr(s){
  s=s.replace(/[−–]/g,"-").replace(/\s+/g,"").toLowerCase();
  if(!s)return null;const T=[];let len=0;
  for(const m of s.matchAll(/([+-]?)(?:(\d*)d(\d+)|(\d+))/g)){
    len+=m[0].length;
    if(m[3])T.push({sg:m[1]==="-"?-1:1,c:+(m[2]||1),f:+m[3]});else T.push({sg:m[1]==="-"?-1:1,k:+m[4]});
  }
  if(len!==s.length||!T.length)return null;
  if(T.reduce((a,t)=>a+(t.c||0),0)>200||T.some(t=>t.f>1000||t.c>200))return null;
  return T;
}
function rollFree(){
  const raw=$("dr_expr").value,T=parseExpr(raw);
  if(!T){showRes({label:"Expressão inválida",total:"?",cls:"bad",det:"Use o formato 2d6+3, 1d10, 1d20-1 …"});return}
  let tot=0;const dice=[],parts=[];
  T.forEach(t=>{
    if(t.k!==undefined){tot+=t.sg*t.k;parts.push((t.sg<0?"−":"+")+t.k);return}
    const r=Array.from({length:t.c},()=>rnd(t.f));tot+=t.sg*r.reduce((a,x)=>a+x,0);
    r.forEach(x=>dice.push({t:(t.sg<0?"−":"")+x,c:t.sg<0?"neg":x===t.f&&t.f>1?"six":""}));
    parts.push(`${t.sg<0?"−":"+"}${t.c}d${t.f}`);
  });
  showRes({label:"Dados livres: "+raw.trim(),total:tot,dice,det:parts.join(" ").replace(/^\+/,"")+" = "+tot});
}
document.addEventListener("click",ev=>{
  const g=ev.target.closest("[data-roll],[data-dv],[data-n],[data-expr],[data-apply],#dr_clr");if(!g)return;
  if(g.id==="dr_clr"){LOG.length=0;$("dr_log").innerHTML='<li style="color:var(--mute)">Nenhuma rolagem ainda.</li>';return}
  if(g.dataset.dv!==undefined){$("dr_dv").value=g.dataset.dv;return}
  if(g.dataset.n){$("dr_n").value=g.dataset.n;$("dr_w").value="";return}
  if(g.dataset.expr){$("dr_expr").value=g.dataset.expr;rollFree();return}
  if(g.dataset.apply){const cur=$("hp").value===""?+$("hpMax").textContent:val("hp");$("hp").value=cur-LASTHP;calc();save();$("dr_act").innerHTML='<span class="note">Aplicado. PV atuais: '+$("hp").value+"</span>";return}
  const r=g.dataset.roll;
  if(r==="skill")rollSkill();else if(r==="init")rollInit();else if(r==="death")rollDeath();
  else if(r==="dmg")rollDmg();else if(r==="free")rollFree();else if(r==="penreset")$("dr_pen").value=0;
});
$("dr_w").addEventListener("change",e=>{const m=/(\d+)\s*d\s*6/i.exec(e.target.value);if(m)$("dr_n").value=m[1];const b=/d\s*6\s*([+-]\s*\d+)/i.exec(e.target.value);$("dr_db").value=b?b[1].replace(/\s/g,""):0});
$("dr_expr").addEventListener("keydown",e=>{if(e.key==="Enter")rollFree()});
refreshDice();
$("bIO").onclick=()=>{$("io").hidden=!$("io").hidden};
$("bExp").onclick=()=>{$("json").value=JSON.stringify(dump());$("json").select()};
$("bImp").onclick=()=>{try{load(JSON.parse($("json").value));calc();save()}catch(e){alert("JSON inválido.")}};
$("bReset").onclick=()=>{if(confirm("Apagar toda a ficha?")){try{localStorage.removeItem(KEY);localStorage.removeItem("cpr_ficha_v1")}catch(e){}location.reload()}};
$("bTheme").onclick=()=>{const r=document.documentElement,dark=getComputedStyle(r).getPropertyValue("--bg").trim()==="#0c0c11";r.dataset.theme=dark?"light":"dark"};
</script>
