<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha Cyberpunk RED</title>
<style>
:root{--bg:#f1eeea;--panel:#fff;--ink:#17171b;--mute:#6c6a72;--line:#d6d1ca;--acc:#8a3a2b;--acc2:#00707f;--warn:#a85f00;--hdr:#0d0d0d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0c11;--panel:#15151d;--ink:#ecebf3;--mute:#8e8da1;--line:#2c2c3b;--acc:#e0553b;--acc2:#19e3ff;--warn:#ffb020;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c0c11;--panel:#15151d;--ink:#ecebf3;--mute:#8e8da1;--line:#2c2c3b;--acc:#e0553b;--acc2:#19e3ff;--warn:#ffb020;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hdr);z-index:20}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--hdr);color:#fff}
h1{margin:0;font:800 20px/1 "Courier New",monospace;letter-spacing:2px;text-transform:uppercase}h1 b{color:#e0553b}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;gap:4px;overflow-x:auto;padding:6px 12px 0;background:var(--hdr);border-bottom:3px solid var(--acc)}
nav button{background:transparent;color:#bdbdc6;border-radius:6px 6px 0 0;padding:9px 16px;white-space:nowrap;border:0}
nav button.on{background:var(--acc);color:#fff}
main{max-width:1100px;margin:0 auto;padding:14px}
.tab{display:none;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.tab.on{display:grid}
section{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:6px;padding:14px;min-width:0}
.wide{grid-column:1/-1}
.hd{margin:-14px -14px 12px;padding:6px 12px;background:var(--hdr);color:#fff;display:flex;justify-content:space-between;align-items:center;min-height:36px}
h2{margin:0;font:700 13px "Courier New",monospace;letter-spacing:2px;text-transform:uppercase}
h3{margin:0 0 4px;font:700 12px "Courier New",monospace;color:var(--acc);text-transform:uppercase;letter-spacing:1px}
input,select,textarea{width:100%;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font:inherit;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc2)}
input[type=number]{text-align:center;padding:6px 2px}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
.g{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.lp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.stat{border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center}
.stat input{font:700 22px "Courier New",monospace;border:0;padding:2px}
.stat span{font-size:11px;color:var(--mute);display:block}
.stat b{font:700 12px "Courier New",monospace;color:var(--acc)}
.der{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:12px}
.box{border:1px dashed var(--line);border-radius:6px;padding:8px;text-align:center}
.box em{display:block;font:700 24px "Courier New",monospace;font-style:normal}
.box small{color:var(--mute);font-size:11px;display:block}
.box input{font:700 22px "Courier New",monospace;border:0;padding:2px}
.state{display:inline-block;padding:2px 8px;border-radius:99px;font:700 12px "Courier New",monospace;border:1px solid currentColor}
.ok{color:var(--acc2)}.hurt{color:var(--warn)}.dead{color:var(--acc)}
.skills{columns:300px;column-gap:20px}
.cat{break-inside:avoid;margin-bottom:14px}
.sk{display:grid;grid-template-columns:1fr 42px 42px 42px 38px;gap:4px;align-items:center;margin-bottom:3px}
.sk.sh{font-size:10px;color:var(--mute);text-align:center;font-style:normal}.sk.sh i{font-style:normal}
.nm{display:flex;gap:4px;align-items:center;font-size:13px;min-width:0}.nm input{padding:3px 6px}
.sk input,.sk select{padding:3px 0;font-size:13px}
.sk b{font:700 11px "Courier New",monospace;color:var(--mute);text-align:center}
.sk output{font:700 14px "Courier New",monospace;text-align:center;color:var(--acc2)}
.gh{font-weight:700;font-size:13px;margin:6px 0 2px}
table{width:100%;border-collapse:collapse}td{padding:2px}th{font-size:11px;color:var(--mute);text-align:left;font-weight:600;padding:2px}
td.q{width:1%}td.q input{width:62px}
.tw{overflow-x:auto}
button{background:var(--acc);color:#fff;border:0;border-radius:4px;padding:7px 12px;font:700 12px "Courier New",monospace;letter-spacing:1px;cursor:pointer}
button.alt{background:transparent;color:inherit;border:1px solid #55555f}
.bar,.pm{display:flex;gap:6px;flex-wrap:wrap}.pm button{width:34px;padding:4px 0;font-size:16px;line-height:1}
.note{font-size:12px;color:var(--mute);margin:6px 0}
#io{max-width:1100px;margin:14px auto 0;padding:0 14px}
@media (max-width:700px){.lp{grid-template-columns:1fr}.lp>*{grid-column:auto!important}}
@media print{header .bar,nav,#io,.pm{display:none}.tab{display:grid}body{background:#fff;color:#000}section{break-inside:avoid}}
</style>
</head>
<body>
<header><h1>Cyberpunk <b>RED</b> // Ficha</h1>
<div class="bar"><button class="alt" id="bTheme">TEMA</button><button class="alt" id="bIO">BACKUP</button><button class="alt" onclick="print()">IMPRIMIR</button><button id="bReset">LIMPAR</button></div></header>
<nav id="tabs"></nav>
<div id="io" hidden><section><div class="hd"><h2>Backup (JSON)</h2></div>
<textarea id="json" spellcheck="false" placeholder="Clique em Gerar e copie o texto para guardar, ou cole um backup aqui e clique em Importar."></textarea>
<div class="bar" style="margin-top:8px"><button id="bExp">GERAR</button><button id="bImp">IMPORTAR</button></div>
<p class="note">A ficha é salva sozinha neste navegador. Use o backup para levar a ficha a outro aparelho.</p></section></div>
<main id="main"></main>

<script>
const $=id=>document.getElementById(id);
const F=(id,l,t="")=>`<div><label for="${id}">${l}</label><input id="${id}" ${t}></div>`;
const T=(id,l,h=80,s=1)=>`<div style="grid-column:span ${s}"><label for="${id}">${l}</label><textarea id="${id}" style="min-height:${h}px"></textarea></div>`;
const PM=k=>`<div class="pm"><button class="alt" data-l="${k}" data-d="-1" title="Remover última linha">−</button><button data-l="${k}" data-d="1" title="Adicionar linha">+</button></div>`;
const SEC=(t,b,x="",c="")=>`<section class="${c}"><div class="hd"><h2>${t}</h2>${x}</div>${b}</section>`;
const lst=k=>`<div class="tw"><table id="${k}"></table></div>`;
const NUM='type="number"';

const ST=[["INT","Inteligência"],["REF","Reflexos"],["DEX","Destreza"],["TECH","Técnica"],["COOL","Frieza"],["WILL","Vontade"],["LUCK","Sorte"],["MOVE","Movimento"],["BODY","Corpo"],["EMP","Empatia"]];
const ROLES={"Rockerboy":"Impacto Carismático","Solo":"Consciência de Combate","Netrunner":"Interface","Tech":"Fabricante","Medtech":"Medicina","Media":"Credibilidade","Exec":"Trabalho em Equipe","Lawman":"Apoio","Fixer":"Operador","Nomad":"Moto"};
const LISTS={
 weap:[["n","Arma"],["d","Dano"],["m","Munição"],["r","CdT"],["o","Notas"]],
 inv:[["n","Item"],["q","Qtd",1],["o","Notas"]],
 deck:[["n","Programa / Hardware"],["a","ATK",1],["d","DEF",1],["r","REZ",1],["c","Classe"]],
 cy:[["n","Implante"],["h","Perda",1]]
};
const CG=["Cyberolho (D)","Cyberolho (E)","Neural Link","Suíte de Cyberáudio","Cyberbraço / mão (D)","Cyberbraço / mão (E)","Interno","Cyberperna / pé (D)","Cyberperna / pé (E)","Externo","Fashionware","Borgware"];
const CNT={weap:3,inv:6,deck:6};CG.forEach((_,i)=>CNT["cy"+i]=2);
const LK=k=>LISTS[k.startsWith("cy")?"cy":k];
// ★ = básica, + = custo x2, @ = título de grupo, ~ = linha com nome editável
const SK=[
["Percepção",["Concentração:WILL*","Ocultar/Revelar Objeto:INT","Leitura Labial:INT","Percepção:INT*","Rastreamento:INT"]],
["Corpo",["Atletismo:DEX*","Contorcionismo:DEX","Dança:DEX","Resistência:WILL","Resistir a Tortura/Drogas:WILL","Furtividade:DEX*"]],
["Controle",["Dirigir Veículo Terrestre:REF","Pilotar Veículo Aéreo:REF+","Pilotar Veículo Marítimo:REF","Montaria:REF"]],
["Educação",["Contabilidade:INT","Trato com Animais:INT","Burocracia:INT","Negócios:INT","Composição:INT","Criminologia:INT","Criptografia:INT","Dedução:INT","Educação:INT*","Jogatina:INT","Pesquisa em Biblioteca:INT","Tática:INT","Sobrevivência:INT","@Idioma","~Gíria de rua:INT*","~:INT","~:INT","@Especialista Local","~Sua região:INT*","~:INT","~:INT","@Ciência","~:INT","~:INT"]],
["Combate",["Briga:DEX*","Evasão:DEX*","Arma Branca:DEX","@Artes Marciais ×2","~:DEX","~:DEX"]],
["Atuação",["Atuação:COOL","@Tocar Instrumento","~:TECH","~:TECH"]],
["Armas à Distância",["Arquearia:REF","Fogo Automático:REF+","Pistola:REF","Armas Pesadas:REF+","Fuzil/Espingarda:REF"]],
["Social",["Suborno:COOL","Conversação:EMP*","Percepção Humana:EMP*","Interrogatório:COOL","Persuasão:COOL*","Aparência Pessoal:COOL","Vida Urbana:COOL","Comércio:COOL","Moda e Estilo:COOL"]],
["Técnica",["Tecnologia Aérea:TECH","Tecnologia Básica:TECH","Cibertecnologia:TECH","Demolições:TECH+","Eletrônica/Segurança:TECH+","Primeiros Socorros:TECH*","Falsificação:TECH","Tecnologia Terrestre:TECH","Pintura/Desenho/Escultura:TECH","Paramédico:TECH+","Fotografia/Filme:TECH","Arrombar Fechaduras:TECH","Furtar:TECH","Tecnologia Marítima:TECH","Tecnologia de Armas:TECH"]]
];
let n=0;
const lvmd=(i,v)=>`<input id="lv${i}" ${NUM} min="0" max="10" value="${v}"><input id="md${i}" ${NUM} value="0">`;
const row=s=>{
  if(s[0]==="@")return `<div class="gh">${s.slice(1)}</div>`;
  const ed=s[0]==="~";if(ed)s=s.slice(1);
  const [nm,r]=s.split(":"),a=r.replace(/[*+]/g,""),st=r.includes("*"),x2=r.includes("+"),i=n++;
  const name=ed?`<input id="nm${i}" value="${nm}" placeholder="nome…">`:`${nm}${x2?" <small>×2</small>":""}`;
  return `<div class="sk" data-a="${a}"><div class="nm">${st?"★ ":""}${name}</div>${lvmd(i,st?2:0)}<b>${a}</b><output>0</output></div>`;
};
const SEL="INT REF DEX TECH COOL WILL EMP BODY".split(" ");
const crow=()=>{const i=n++;return `<div class="sk" data-a=""><div class="nm"><input id="nm${i}" placeholder="Perícia personalizada"></div>${lvmd(i,0)}<select id="st${i}">${SEL.map(s=>`<option>${s}</option>`).join("")}</select><output>0</output></div>`};
const SH=`<div class="sk sh"><span></span><i>NÍV</i><i>MOD</i><i>ATR</i><i>BASE</i></div>`;

const LP=[["lp_origem","Origens Culturais"],["lp_pers","Personalidade",2],["lp_roupa","Roupas e Cabelo",2],["lp_valor","O que mais valoriza"],["lp_sent","Sentimentos sobre as Pessoas"],["lp_pessoa","Pessoa mais valorizada"],["lp_posse","Posse mais valorizada"],["lp_fam","Origem Familiar"],["lp_inf","Ambiente da Infância"],["lp_crise","Crise Familiar"],["lp_meta","Objetivos de Vida"],["lp_amor","Casos de Amor Trágicos",2]];
const KC=[["kc_amigos","Amigos"],["kc_inim","Inimigos"],["kc_porque","Por quê?"],["kc_role","Lifepath da Função",2],["kc_lancar","O que podem lançar contra você?"],["kc_rep","Reputação e Eventos"],["kc_imp","Aprimoramento"]];
const lpHtml=a=>`<div class="lp">${a.map(([id,l,s])=>T(id,l,70,s||1)).join("")}</div>`;
const box=(l,v)=>`<div class="box"><small>${l}</small>${v}</div>`;

const P={};
P.ficha=SEC("Identidade",`<div class="g g2">${F("nome","Handle")}${F("alias","Apelidos / Aliases")}<div><label for="role">Função (Role)</label><select id="role">${Object.keys(ROLES).map(r=>`<option>${r}</option>`).join("")}</select></div>${F("rank","Habilidade de função (#)",NUM+' min="1" max="10" value="4"')}</div><p class="note" id="roleAb"></p>`,"","wide")
+SEC("Atributos",`<div class="stats">${ST.map(([k,t])=>`<div class="stat"><b>${k}</b><input id="s_${k}" ${NUM} min="1" max="${k==="MOVE"?10:8}" value="5"><span>${t}</span></div>`).join("")}</div>
<div class="der">${box("PV MÁXIMOS",'<em id="hpMax">0</em>')}${box("PV ATUAIS",`<input id="hp" ${NUM} value="0">`)}${box("FERIDA GRAVE (abaixo de)",'<em id="hurt">0</em>')}${box("TESTE DE MORTE",'<em id="death">0</em>')}${box("HUMANIDADE (atual / máx)",'<em id="hum">0</em>')}${box("SORTE",`<input id="luck" ${NUM} value="0">`)}</div>
<p style="margin:10px 0 0">Estado: <span class="state ok" id="state">—</span></p>`,"","wide")
+SEC("Ferimentos e Vícios",`<div class="g">${T("crit","Ferimentos críticos",70)}${T("addic","Vícios",70)}</div>`)
+SEC("Armadura (PA)",`<div class="tw"><table style="min-width:400px"><tr><th></th><th>Nome</th><th>PA</th><th>Máx</th><th>Penal.</th></tr>${[["ah","Cabeça"],["ab","Corpo"],["as","Escudo"]].map(([r,t])=>`<tr><td>${t}</td><td><input id="${r}_n"></td>${["c","m","p"].map(c=>`<td class="q"><input id="${r}_${c}" ${NUM}></td>`).join("")}</tr>`).join("")}</table></div><p class="note">A armadura perde 1 de PA a cada ataque que a penetra.</p>`)
+SEC("Armas",lst("weap"),PM("weap"),"wide");
P.pericias=SEC("Perícias",`<p class="note">★ básica (nível inicial 2) · ×2 custa o dobro de IP · BASE = atributo + nível + mod.</p><div class="skills">${SK.map(([c,l])=>`<div class="cat"><h3>${c}</h3>${SH}${l.map(row).join("")}</div>`).join("")}<div class="cat"><h3>Personalizadas</h3>${SH}${Array.from({length:8},crow).join("")}</div></div>`,"","wide");
P.lifepath=SEC("Lifepath",lpHtml(LP),"","wide")+SEC("Companheiros e Carreira",lpHtml(KC),"","wide");
P.cyber=SEC("Humanidade",`<div class="der" style="margin:0">${box("HUMANIDADE MÁX",'<em id="hmax">0</em>')}${box("PERDA TOTAL",'<em id="loss">0</em>')}${box("HUMANIDADE ATUAL",'<em id="hcur">0</em>')}${box("EMP EFETIVA",'<em id="empEf">0</em>')}</div><p class="note">EMP efetiva = Humanidade atual ÷ 10 (arredondada para baixo). Use + e − para criar mais linhas em cada região.</p>`,"","wide")
+CG.map((t,i)=>SEC(t,lst("cy"+i),PM("cy"+i))).join("");
P.deck=SEC("Cyberdeck",`<div class="g g4">${F("dk_n","Modelo")}${F("dk_p","Slots de programa",NUM)}${F("dk_h","Slots de hardware",NUM)}${F("dk_u","Slots universais",NUM)}</div>`,"","wide")
+SEC("Programas / Hardware",lst("deck"),PM("deck"),"wide");
P.inv=SEC("Meus Pertences",`<div class="g g4">${F("casa","Moradia")}${F("aluguel","Aluguel")}${F("estilo","Estilo de vida")}${F("eb","Eurodólares (eb)",NUM)}${F("ip","Pontos de Aprimoramento (IP)",NUM)}${F("rep","Reputação",NUM)}</div><div style="margin-top:10px">${T("moda","Moda",60)}</div>`,"","wide")
+SEC("Inventário",lst("inv"),PM("inv"),"wide");

const TABS=[["ficha","Ficha"],["pericias","Perícias"],["lifepath","Lifepath"],["cyber","Cyberware"],["deck","Cyberdeck"],["inv","Inventário"]];
$("tabs").innerHTML=TABS.map(([k,t])=>`<button data-t="${k}">${t}</button>`).join("");
$("main").innerHTML=TABS.map(([k])=>`<div class="tab" id="tab_${k}">${P[k]}</div>`).join("");
let TAB="ficha";
function show(t){TAB=t;TABS.forEach(([k])=>{$("tab_"+k).classList.toggle("on",k===t);document.querySelector(`[data-t="${k}"]`).classList.toggle("on",k===t)})}

function renderList(k){
  const L=LK(k),keep={};
  document.querySelectorAll("#"+k+" input").forEach(e=>keep[e.id]=e.value);
  let h="<tr>"+L.map(c=>`<th>${c[1]}</th>`).join("")+"</tr>";
  for(let i=0;i<CNT[k];i++)h+="<tr>"+L.map(c=>`<td${c[2]?' class="q"':""}><input id="${k}_${i}_${c[0]}"${c[2]?' type="number" min="0"':""}${c[0]==="h"?' class="hl"':""}></td>`).join("")+"</tr>";
  $(k).innerHTML=h;
  for(const id in keep){const e=$(id);if(e)e.value=keep[id]}
}
Object.keys(CNT).forEach(renderList);

const val=id=>+$(id).value||0;
function calc(){
  const body=val("s_BODY"),will=val("s_WILL"),emp=val("s_EMP");
  const hp=10+5*Math.ceil((body+will)/2),hurt=Math.ceil(hp/2);
  let loss=0;document.querySelectorAll(".hl").forEach(e=>loss+=+e.value||0);
  const hmax=emp*10,hcur=Math.max(0,hmax-loss);
  $("hpMax").textContent=hp;$("hurt").textContent=hurt;$("death").textContent=body;
  $("hum").textContent=hcur+" / "+hmax;
  $("hmax").textContent=hmax;$("loss").textContent=loss;$("hcur").textContent=hcur;$("empEf").textContent=Math.floor(hcur/10);
  const cur=$("hp").value===""?hp:val("hp");let t="Saudável",c="ok";
  if(cur<=0){t="Mortalmente ferido (teste de morte)";c="dead"}
  else if(cur<hurt){t="Gravemente ferido (−2 em todas as ações)";c="hurt"}
  else if(cur<hp){t="Ferido"}
  $("state").textContent=t;$("state").className="state "+c;
  document.querySelectorAll(".sk:not(.sh)").forEach(r=>{
    const x=r.querySelectorAll("input[type=number]"),s=r.querySelector("select"),a=s?s.value:r.dataset.a;
    r.querySelector("output").textContent=val("s_"+a)+(+x[0].value||0)+(+x[1].value||0);
  });
  $("roleAb").textContent="Habilidade de função: "+ROLES[$("role").value]+" (rank "+val("rank")+")";
}

const KEY="cpr_ficha_v2";
const dump=()=>{const d={};document.querySelectorAll("input[id],select[id],textarea[id]").forEach(e=>{if(e.id!=="json")d[e.id]=e.value});d.__n=CNT;d.__t=TAB;return d};
function save(){try{localStorage.setItem(KEY,JSON.stringify(dump()))}catch(e){}}
function load(d){
  if(d.__n){for(const k in CNT)if(Number.isInteger(d.__n[k]))CNT[k]=Math.max(0,Math.min(40,d.__n[k]));Object.keys(CNT).forEach(renderList)}
  for(const k in d){const e=$(k);if(e&&k!=="json"&&typeof d[k]==="string")e.value=d[k]}
  if(typeof d.__t==="string"&&$("tab_"+d.__t))show(d.__t);
}
show("ficha");
try{const raw=localStorage.getItem(KEY)||localStorage.getItem("cpr_ficha_v1");if(raw)load(JSON.parse(raw))}catch(e){}
if(!$("hp").value||$("hp").value==="0"){calc();$("hp").value=$("hpMax").textContent}
calc();

document.addEventListener("input",()=>{calc();save()});
document.addEventListener("click",ev=>{
  const t=ev.target.closest("button[data-t]");
  if(t){show(t.dataset.t);save();scrollTo(0,0);return}
  const b=ev.target.closest("button[data-l]");if(!b)return;
  const k=b.dataset.l,d=+b.dataset.d,L=LK(k);
  if(d<0&&CNT[k]>0){const last=CNT[k]-1;if(L.some(c=>$(`${k}_${last}_${c[0]}`).value!=="")&&!confirm("Remover a última linha? Os dados dela serão apagados."))return}
  CNT[k]=Math.max(0,Math.min(40,CNT[k]+d));renderList(k);calc();save();
});
$("bIO").onclick=()=>{$("io").hidden=!$("io").hidden};
$("bExp").onclick=()=>{$("json").value=JSON.stringify(dump());$("json").select()};
$("bImp").onclick=()=>{try{load(JSON.parse($("json").value));calc();save()}catch(e){alert("JSON inválido.")}};
$("bReset").onclick=()=>{if(confirm("Apagar toda a ficha?")){try{localStorage.removeItem(KEY);localStorage.removeItem("cpr_ficha_v1")}catch(e){}location.reload()}};
$("bTheme").onclick=()=>{const r=document.documentElement,dark=getComputedStyle(r).getPropertyValue("--bg").trim()==="#0c0c11";r.dataset.theme=dark?"light":"dark"};
</script>
</body>
</html>
